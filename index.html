<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Blocks</title>

    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Barra superior */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;

            background-color: #111;
            border-bottom: 2px solid #292929;

            display: flex;
            align-items: center;

            padding-left: 20px;
            box-sizing: border-box;

            z-index: 1000;
        }

        .download-top {
            background-color: #fff;
            color: #000;

            padding: 11px 22px;

            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            border-radius: 5px;
        }

        .download-top:hover {
            background-color: #ddd;
        }


        /* Primera sección */
        .hero {
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            box-sizing: border-box;
            padding: 80px 20px 20px;
        }

        .logo {
            width: 300px;
            max-width: 80%;
            margin-bottom: 45px;
        }

        .slogan {
            font-size: 52px;
            font-weight: bold;

            margin: 0;
        }


        /* Segunda sección */
        .features {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 80px 20px;

            background-color: #080808;

            border-top: 2px solid #222;
        }

        .features h2 {
            font-size: 36px;
            margin-bottom: 45px;
        }

        .buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            max-width: 900px;
        }

        .button {
            display: inline-block;

            padding: 16px 25px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            transition: transform 0.15s, background-color 0.15s;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .download-button {
            background-color: white;
            color: black;
        }

        .download-button:hover {
            background-color: #ddd;
        }

        .discord-button {
            background-color: #5865F2;
            color: white;
        }

        .discord-button:hover {
            background-color: #4752c4;
        }

        .avatar-button {
            background-color: #151515;
            color: white;

            border: 1px solid #444;
        }

        .avatar-button:hover {
            background-color: #222;
        }


        /* Texto inferior */
        .small-text {
            margin-top: 55px;

            color: #777;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Barra superior -->

    <div class="topbar">

        <a
            class="download-top"
            href="https://pablopalo2014.itch.io/game-blocks"
        >
            Descargar
        </a>

    </div>


    <!-- Primera sección -->

    <section class="hero">

        <img
            class="logo"
            src="game blocks logo(1).png"
            alt="Game Blocks Logo"
        >

        <h1 class="slogan">
            Potenciando la construccion
        </h1>

    </section>


    <!-- Segunda sección -->

    <section class="features">

        <h2>
            Game Blocks
        </h2>

        <div class="buttons">

            <a
                class="button download-button"
                href="https://pablopalo2014.itch.io/game-blocks"
            >
                Descargar Game Blocks
            </a>

            <a
                class="button discord-button"
                href="https://discord.gg/Up24N45SK3"
                target="_blank"
            >
                💬 Unirse al Discord
            </a>

            <a
                class="button avatar-button"
                href="#"
            >
                Quien sabe lo que tu avatar podrá hacer a futuro...
            </a>

        </div>

        <p class="small-text">
            Más cosas están por llegar...
        </p>

    </section>

</body>
</html>
