<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game Blocks</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1f1f1f; border-bottom: 1px solid #333; }
        
        .search-container { position: relative; width: 300px; }
        .search-bar { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #1f1f1f; border: 1px solid #333; border-radius: 4px; max-height: 200px; overflow-y: auto; display: none; z-index: 10; }
        .search-item { padding: 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
        .search-item:hover { background: #2a2a2a; }

        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .profile-card { background: #1f1f1f; padding: 25px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        
        .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #555; }
        .username-container { margin: 10px 0; }
        .username { font-size: 2.2em; font-weight: bold; vertical-align: middle; }
        .badge { font-size: 1.3em; margin-left: 6px; vertical-align: middle; }

        .bio { margin: 15px 0; color: #ccc; font-style: italic; white-space: pre-wrap; }
        .edit-btn { background: #333; color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        .friends-section { margin-top: 30px; text-align: left; border-top: 1px solid #333; padding-top: 15px; }
        .friends-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .friend-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: #2a2a2a; border-radius: 4px; }
        .friend-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

<header>
    <h2>Game Blocks</h2>
    <div class="search-container">
        <input type="text" id="globalSearch" class="search-bar" placeholder="Buscar usuarios..." oninput="searchUsers()">
        <div id="searchResults" class="search-results"></div>
    </div>
</header>

<div class="container">
    <div class="profile-card" id="profileView">
        <input type="file" id="avatarInput" style="display:none" accept="image/*" onchange="uploadAvatar(event)">
        <img id="profileAvatar" src="https://via.placeholder.com/120" class="avatar" onclick="triggerAvatarUpload()">
        
        <div class="username-container">
            <span id="profileUsername" class="username"></span>
            <span id="profileBadges"></span>
        </div>

        <p id="profileBio" class="bio"></p>
        <button id="editBioBtn" class="edit-btn" onclick="editBio()">Editar Bio</button>

        <div class="friends-section">
            <h3>Amigos</h3>
            <div id="friendsList" class="friends-list"></div>
        </div>
    </div>
</div>

<script>
    const BADGE_ICONS = {
        server_booster: "⭐",
        admin: "🛡️",
        game_blocks: "🟥",
        creator_content: "▶️"
    };

    let currentUser = null;

    async function loadProfile() {
        const res = await fetch("/api/me", {
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
        });
        if (res.ok) {
            currentUser = await res.json();
            renderProfile(currentUser, true);
            loadFriends();
        }
    }

    function renderProfile(user, isOwner) {
        document.getElementById("profileUsername").innerText = user.username;
        document.getElementById("profileBio").innerText = user.bio || "Sin biografía.";
        document.getElementById("profileAvatar").src = user.avatar || "https://via.placeholder.com/120";
        document.getElementById("editBioBtn").style.display = isOwner ? "inline-block" : "none";

        const badgesContainer = document.getElementById("profileBadges");
        badgesContainer.innerHTML = "";
        (user.badges || []).forEach(b => {
            if (BADGE_ICONS[b]) {
                const span = document.createElement("span");
                span.className = "badge";
                span.innerText = BADGE_ICONS[b];
                badgesContainer.appendChild(span);
            }
        });
    }

    function triggerAvatarUpload() {
        document.getElementById("avatarInput").click();
    }

    function uploadAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;
            const res = await fetch("/api/profile/update", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify({ avatar: base64 })
            });
            if (res.ok) {
                currentUser.avatar = base64;
                document.getElementById("profileAvatar").src = base64;
            }
        };
        reader.readAsDataURL(file);
    }

    async function editBio() {
        const newBio = prompt("Escribe tu nueva biografía:", currentUser.bio || "");
        if (newBio !== null) {
            const res = await fetch("/api/profile/update", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify({ bio: newBio })
            });
            if (res.ok) {
                currentUser.bio = newBio;
                document.getElementById("profileBio").innerText = newBio;
            }
        }
    }

    async function loadFriends() {
        const res = await fetch("/api/friends", {
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
        });
        if (res.ok) {
            const data = await res.json();
            const list = document.getElementById("friendsList");
            list.innerHTML = "";
            data.friends.forEach(f => {
                const item = document.createElement("div");
                item.className = "friend-item";
                item.innerHTML = `
                    <img src="${f.avatar || 'https://via.placeholder.com/36'}" class="friend-avatar">
                    <span><b>${f.username}</b></span>
                `;
                list.appendChild(item);
            });
        }
    }

    async function searchUsers() {
        const query = document.getElementById("globalSearch").value.trim();
        const resultsDiv = document.getElementById("searchResults");
        if (!query) {
            resultsDiv.style.display = "none";
            return;
        }
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`, {
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
        });
        if (res.ok) {
            const data = await res.json();
            resultsDiv.style.display = "block";
            resultsDiv.innerHTML = "";
            data.users.forEach(u => {
                const item = document.createElement("div");
                item.className = "search-item";
                item.innerHTML = `
                    <img src="${u.avatar || 'https://via.placeholder.com/36'}" class="friend-avatar">
                    <span>${u.username}</span>
                `;
                item.onclick = () => renderProfile(u, u.id === currentUser.id);
                resultsDiv.appendChild(item);
            });
        }
    }

    loadProfile();
</script>
</body>
</html>
