<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Blocks</title>

    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;

            background-color: #111;
            border-bottom: 2px solid #292929;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
            box-sizing: border-box;

            z-index: 1000;
        }

        .topbar-left,
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .download-top,
        .account-button {
            background-color: #fff;
            color: #000;

            padding: 11px 22px;

            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            border-radius: 5px;

            border: none;
            cursor: pointer;
        }

        .download-top:hover,
        .account-button:hover {
            background-color: #ddd;
        }

        .hero {
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            box-sizing: border-box;
            padding: 80px 20px 20px;
        }

        .logo {
            width: 300px;
            max-width: 80%;
            margin-bottom: 45px;
        }

        .slogan {
            font-size: 52px;
            font-weight: bold;

            margin: 0;
        }

        .features {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 80px 20px;

            background-color: #080808;

            border-top: 2px solid #222;
        }

        .features h2 {
            font-size: 36px;
            margin-bottom: 45px;
        }

        .buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            max-width: 900px;
        }

        .button {
            display: inline-block;

            padding: 16px 25px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            transition: transform 0.15s, background-color 0.15s;

            cursor: pointer;
            border: none;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .download-button {
            background-color: white;
            color: black;
        }

        .download-button:hover {
            background-color: #ddd;
        }

        .discord-button {
            background-color: #5865F2;
            color: white;
        }

        .discord-button:hover {
            background-color: #4752c4;
        }

        .avatar-button {
            background-color: #151515;
            color: white;

            border: 1px solid #444;
        }

        .avatar-button:hover {
            background-color: #222;
        }

        .small-text {
            margin-top: 55px;

            color: #777;

            font-size: 14px;
        }

        /* MODALES */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.8);

            justify-content: center;
            align-items: center;

            z-index: 2000;
        }

        .modal-box {
            width: 90%;
            max-width: 500px;

            max-height: 85vh;

            overflow-y: auto;

            background: #111;

            border: 1px solid #333;

            border-radius: 10px;

            padding: 25px;

            box-sizing: border-box;

            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .modal-box h2 {
            margin-top: 0;
        }

        .close {
            float: right;

            background: transparent;

            color: #aaa;

            border: none;

            font-size: 25px;

            cursor: pointer;
        }

        .close:hover {
            color: white;
        }

        input {
            width: 100%;

            box-sizing: border-box;

            padding: 13px;

            margin: 7px 0 12px;

            background: #050505;

            color: white;

            border: 1px solid #444;

            border-radius: 5px;

            outline: none;
        }

        input:focus {
            border-color: white;
        }

        .form-button {
            width: 100%;

            padding: 13px;

            margin-top: 5px;

            background: white;

            color: black;

            border: none;

            border-radius: 5px;

            font-weight: bold;

            cursor: pointer;
        }

        .form-button:hover {
            background: #ddd;
        }

        .secondary-button {
            width: 100%;

            padding: 12px;

            margin-top: 10px;

            background: #191919;

            color: white;

            border: 1px solid #444;

            border-radius: 5px;

            cursor: pointer;
        }

        .secondary-button:hover {
            background: #252525;
        }

        .danger-button {
            background: #5c1717;
            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }

        .danger-button:hover {
            background: #7a1d1d;
        }

        .friend-button {
            background: #222;

            color: white;

            border: 1px solid #444;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }

        .friend-button:hover {
            background: #333;
        }

        .account-section {
            margin-bottom: 25px;
        }

        .account-section h3 {
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .user-result,
        .friend-result,
        .request-result {
            background: #181818;

            border: 1px solid #333;

            border-radius: 6px;

            padding: 12px;

            margin: 8px 0;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;
        }

        .username {
            font-weight: bold;
        }

        .status {
            color: #777;
            font-size: 13px;
        }

        .error {
            color: #ff5555;
            margin-top: 10px;
        }

        .success {
            color: #55dd77;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- BARRA SUPERIOR -->

    <div class="topbar">

        <div class="topbar-left">

            <a
                class="download-top"
                href="https://pablopalo2014.itch.io/game-blocks"
            >
                Descargar
            </a>

        </div>

        <div class="topbar-right">

            <button
                id="accountButton"
                class="account-button"
                onclick="openAccount()"
            >
                👤 Cuenta
            </button>

        </div>

    </div>


    <!-- PRIMERA SECCIÓN -->

    <section class="hero">

        <img
            class="logo"
            src="game blocks logo(1).png"
            alt="Game Blocks Logo"
        >

        <h1 class="slogan">
            Potenciando la construccion
        </h1>

    </section>


    <!-- SEGUNDA SECCIÓN -->

    <section class="features">

        <h2>
            Game Blocks
        </h2>

        <div class="buttons">

            <a
                class="button download-button"
                href="https://pablopalo2014.itch.io/game-blocks"
            >
                ⬇️ Descargar Game Blocks
            </a>

            <a
                class="button discord-button"
                href="https://discord.gg/Up24N45SK3"
                target="_blank"
            >
                💬 Unirse al Discord
            </a>

            <button
                class="button avatar-button"
                onclick="openAccount()"
            >
                👤 Mi cuenta
            </button>

        </div>

        <p class="small-text">
            Más cosas están por llegar...
        </p>

    </section>


    <!-- MODAL CUENTA -->

    <div
        id="accountModal"
        class="modal"
        onclick="closeOutside(event, 'accountModal')"
    >

        <div class="modal-box">

            <button
                class="close"
                onclick="closeModal('accountModal')"
            >
                ×
            </button>

            <!-- LOGIN -->

            <div id="loginSection">

                <h2>Iniciar sesión</h2>

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Nombre de usuario"
                    maxlength="30"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Contraseña"
                >

                <button
                    class="form-button"
                    onclick="login()"
                >
                    Iniciar sesión
                </button>

                <button
                    class="secondary-button"
                    onclick="showRegister()"
                >
                    Crear una cuenta
                </button>

                <p id="loginMessage"></p>

            </div>


            <!-- REGISTRO -->

            <div
                id="registerSection"
                class="hidden"
            >

                <h2>Crear cuenta</h2>

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Nombre de usuario"
                    maxlength="30"
                >

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Contraseña"
                >

                <input
                    id="registerPassword2"
                    type="password"
                    placeholder="Repetir contraseña"
                >

                <button
                    class="form-button"
                    onclick="register()"
                >
                    Crear cuenta
                </button>

                <button
                    class="secondary-button"
                    onclick="showLogin()"
                >
                    Ya tengo una cuenta
                </button>

                <p id="registerMessage"></p>

            </div>


            <!-- CUENTA LOGUEADA -->

            <div
                id="loggedSection"
                class="hidden"
            >

                <h2 id="welcomeText">
                    Mi cuenta
                </h2>


                <!-- BUSCAR -->

                <div class="account-section">

                    <h3>🔎 Buscar cuentas</h3>

                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Buscar usuario..."
                        maxlength="30"
                    >

                    <button
                        class="form-button"
                        onclick="searchUsers()"
                    >
                        Buscar
                    </button>

                    <div id="searchResults"></div>

                </div>


                <!-- SOLICITUDES -->

                <div class="account-section">

                    <h3>👥 Solicitudes de amistad</h3>

                    <div id="friendRequests">
                        Cargando...
                    </div>

                </div>


                <!-- AMIGOS -->

                <div class="account-section">

                    <h3>⭐ Mis amigos</h3>

                    <div id="friendsList">
                        Cargando...
                    </div>

                </div>


                <button
                    class="secondary-button"
                    onclick="logout()"
                >
                    Cerrar sesión
                </button>

            </div>

        </div>

    </div>


    <script>

        /*
         * =========================================================
         * CONFIGURACIÓN
         * =========================================================
         *
         * CAMBIA ESTA URL POR LA URL DE TU SERVIDOR DE RENDER.
         *
         * Ejemplo:
         *
         * https://game-blocks-api.onrender.com
         *
         */

        const RENDER_API = "https://TU-SERVIDOR.onrender.com";


        /*
         * =========================================================
         * UTILIDADES
         * =========================================================
         */

        function getToken() {

            return localStorage.getItem("gameblocks_token");

        }


        function setToken(token) {

            localStorage.setItem(
                "gameblocks_token",
                token
            );

        }


        function removeToken() {

            localStorage.removeItem(
                "gameblocks_token"
            );

        }


        async function api(endpoint, options = {}) {

            const headers = {
                "Content-Type": "application/json",
                ...(options.headers || {})
            };


            const token = getToken();


            if (token) {

                headers["Authorization"] =
                    "Bearer " + token;

            }


            const response = await fetch(
                RENDER_API + endpoint,
                {
                    ...options,
                    headers: headers
                }
            );


            let data = {};


            try {

                data = await response.json();

            } catch {

                data = {};

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Ha ocurrido un error."
                );

            }


            return data;

        }


        /*
         * =========================================================
         * MODALES
         * =========================================================
         */

        function openAccount() {

            document.getElementById(
                "accountModal"
            ).style.display = "flex";


            updateAccountUI();

        }


        function closeModal(id) {

            document.getElementById(id)
                .style.display = "none";

        }


        function closeOutside(event, id) {

            if (event.target.id === id) {

                closeModal(id);

            }

        }


        function showRegister() {

            document.getElementById(
                "loginSection"
            ).classList.add("hidden");


            document.getElementById(
                "registerSection"
            ).classList.remove("hidden");


            document.getElementById(
                "registerMessage"
            ).textContent = "";

        }


        function showLogin() {

            document.getElementById(
                "registerSection"
            ).classList.add("hidden");


            document.getElementById(
                "loginSection"
            ).classList.remove("hidden");


            document.getElementById(
                "loginMessage"
            ).textContent = "";

        }


        /*
         * =========================================================
         * REGISTRO
         * =========================================================
         */

        async function register() {

            const username =
                document.getElementById(
                    "registerUsername"
                ).value.trim();


            const password =
                document.getElementById(
                    "registerPassword"
                ).value;


            const password2 =
                document.getElementById(
                    "registerPassword2"
                ).value;


            const message =
                document.getElementById(
                    "registerMessage"
                );


            message.className = "";


            if (!username || !password) {

                message.className = "error";

                message.textContent =
                    "Completa todos los campos.";

                return;

            }


            if (password !== password2) {

                message.className = "error";

                message.textContent =
                    "Las contraseñas no coinciden.";

                return;

            }


            if (password.length < 6) {

                message.className = "error";

                message.textContent =
                    "La contraseña debe tener al menos 6 caracteres.";

                return;

            }


            try {

                const data = await api(
                    "/api/register",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


                setToken(data.token);


                message.className = "success";

                message.textContent =
                    "Cuenta creada correctamente.";


                setTimeout(() => {

                    updateAccountUI();

                }, 500);


            } catch (error) {

                message.className = "error";

                message.textContent =
                    error.message;

            }

        }


        /*
         * =========================================================
         * LOGIN
         * =========================================================
         */

        async function login() {

            const username =
                document.getElementById(
                    "loginUsername"
                ).value.trim();


            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            message.className = "";


            try {

                const data = await api(
                    "/api/login",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


                setToken(data.token);


                message.className = "success";

                message.textContent =
                    "Sesión iniciada.";


                setTimeout(() => {

                    updateAccountUI();

                }, 500);


            } catch (error) {

                message.className = "error";

                message.textContent =
                    error.message;

            }

        }


        /*
         * =========================================================
         * INTERFAZ DE CUENTA
         * =========================================================
         */

        async function updateAccountUI() {

            const token = getToken();


            if (!token) {

                document.getElementById(
                    "loginSection"
                ).classList.remove("hidden");


                document.getElementById(
                    "registerSection"
                ).classList.add("hidden");


                document.getElementById(
                    "loggedSection"
                ).classList.add("hidden");


                return;

            }


            try {

                const data =
                    await api("/api/me");


                document.getElementById(
                    "loginSection"
                ).classList.add("hidden");


                document.getElementById(
                    "registerSection"
                ).classList.add("hidden");


                document.getElementById(
                    "loggedSection"
                ).classList.remove("hidden");


                document.getElementById(
                    "welcomeText"
                ).textContent =
                    "👤 " + data.username;


                document.getElementById(
                    "accountButton"
                ).textContent =
                    "👤 " + data.username;


                loadFriends();

                loadFriendRequests();


            } catch {

                removeToken();

                updateAccountUI();

            }

        }


        /*
         * =========================================================
         * CERRAR SESIÓN
         * =========================================================
         */

        function logout() {

            removeToken();

            document.getElementById(
                "accountButton"
            ).textContent = "👤 Cuenta";


            showLogin();

            updateAccountUI();

        }


        /*
         * =========================================================
         * BUSCAR USUARIOS
         * =========================================================
         */

        async function searchUsers() {

            const query =
                document.getElementById(
                    "searchInput"
                ).value.trim();


            const results =
                document.getElementById(
                    "searchResults"
                );


            results.innerHTML =
                "Buscando...";


            if (!query) {

                results.innerHTML =
                    "Escribe un nombre.";

                return;

            }


            try {

                const data =
                    await api(
                        "/api/users/search?q=" +
                        encodeURIComponent(query)
                    );


                results.innerHTML = "";


                if (!data.users ||
                    data.users.length === 0) {

                    results.innerHTML =
                        "No se encontraron usuarios.";

                    return;

                }


                data.users.forEach(user => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "user-result";


                    div.innerHTML = `

                        <div>
                            <div class="username">
                                ${escapeHTML(user.username)}
                            </div>

                            <div class="status">
                                Usuario de Game Blocks
                            </div>
                        </div>

                        <button
                            class="friend-button"
                            onclick="sendFriendRequest(${user.id})"
                        >
                            Añadir
                        </button>

                    `;


                    results.appendChild(div);

                });


            } catch (error) {

                results.innerHTML =
                    `<span class="error">
                        ${escapeHTML(error.message)}
                    </span>`;

            }

        }


        /*
         * =========================================================
         * SOLICITUD DE AMISTAD
         * =========================================================
         */

        async function sendFriendRequest(userId) {

            try {

                await api(
                    "/api/friends/request",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            userId: userId
                        })
                    }
                );


                alert(
                    "Solicitud de amistad enviada."
                );


            } catch (error) {

                alert(error.message);

            }

        }


        /*
         * =========================================================
         * SOLICITUDES RECIBIDAS
         * =========================================================
         */

        async function loadFriendRequests() {

            const container =
                document.getElementById(
                    "friendRequests"
                );


            try {

                const data =
                    await api(
                        "/api/friends/requests"
                    );


                container.innerHTML = "";


                if (
                    !data.requests ||
                    data.requests.length === 0
                ) {

                    container.innerHTML =
                        "No tienes solicitudes.";

                    return;

                }


                data.requests.forEach(request => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "request-result";


                    div.innerHTML = `

                        <span class="username">
                            ${escapeHTML(request.username)}
                        </span>

                        <div>

                            <button
                                class="friend-button"
                                onclick="acceptFriend(${request.id})"
                            >
                                Aceptar
                            </button>

                            <button
                                class="danger-button"
                                onclick="rejectFriend(${request.id})"
                            >
                                Rechazar
                            </button>

                        </div>

                    `;


                    container.appendChild(div);

                });


            } catch (error) {

                container.innerHTML =
                    `<span class="error">
                        ${escapeHTML(error.message)}
                    </span>`;

            }

        }


        async function acceptFriend(requestId) {

            try {

                await api(
                    "/api/friends/accept",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            requestId
                        })
                    }
                );


                loadFriendRequests();

                loadFriends();


            } catch (error) {

                alert(error.message);

            }

        }


        async function rejectFriend(requestId) {

            try {

                await api(
                    "/api/friends/reject",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            requestId
                        })
                    }
                );


                loadFriendRequests();


            } catch (error) {

                alert(error.message);

            }

        }


        /*
         * =========================================================
         * LISTA DE AMIGOS
         * =========================================================
         */

        async function loadFriends() {

            const container =
                document.getElementById(
                    "friendsList"
                );


            try {

                const data =
                    await api(
                        "/api/friends"
                    );


                container.innerHTML = "";


                if (
                    !data.friends ||
                    data.friends.length === 0
                ) {

                    container.innerHTML =
                        "Todavía no tienes amigos.";

                    return;

                }


                data.friends.forEach(friend => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "friend-result";


                    div.innerHTML = `

                        <div>

                            <div class="username">
                                ${escapeHTML(friend.username)}
                            </div>

                            <div class="status">
                                Amigo
                            </div>

                        </div>

                        <button
                            class="danger-button"
                            onclick="removeFriend(${friend.id})"
                        >
                            Eliminar
                        </button>

                    `;


                    container.appendChild(div);

                });


            } catch (error) {

                container.innerHTML =
                    `<span class="error">
                        ${escapeHTML(error.message)}
                    </span>`;

            }

        }


        async function removeFriend(userId) {

            if (
                !confirm(
                    "¿Seguro que quieres eliminar a este amigo?"
                )
            ) {

                return;

            }


            try {

                await api(
                    "/api/friends/remove",
                    {
                        method: "POST",

                        body: JSON.stringify({
                            userId
                        })
                    }
                );


                loadFriends();


            } catch (error) {

                alert(error.message);

            }

        }


        /*
         * =========================================================
         * SEGURIDAD DEL HTML
         * =========================================================
         */

        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                String(value);


            return div.innerHTML;

        }


        /*
         * =========================================================
         * INICIO
         * =========================================================
         */

        window.addEventListener(
            "load",
            () => {

                if (getToken()) {

                    updateAccountUI();

                }

            }
        );

    </script>

</body>
</html>
