<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Blocks</title>
  <!-- Model Viewer CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1, h2 { margin-bottom: 15px; color: #00e676; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, button, textarea { width: 100%; padding: 10px; margin-top: 8px; border-radius: 4px; border: none; }
    input, textarea { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #00e676; color: #121212; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #00c853; }
    button:disabled { background: #555; cursor: not-allowed; }
    .hidden { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .item-card { background: #2a2a2a; padding: 10px; border-radius: 6px; text-align: center; }
    model-viewer { width: 100%; height: 200px; background-color: #1a1a1a; border-radius: 4px; }
    .error-msg { color: #ff5252; margin-top: 10px; font-size: 0.9em; }
    .success-msg { color: #69f0ae; margin-top: 10px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Game Blocks</h1>

    <!-- Panel Auth -->
    <div id="auth-panel" class="card">
      <h2>Iniciar Sesión / Registro</h2>
      <input type="text" id="username" placeholder="Nombre de usuario" />
      <input type="password" id="password" placeholder="Contraseña" />
      <div style="display: flex; gap: 10px;">
        <button id="btn-login" onclick="login()">Iniciar Sesión</button>
        <button id="btn-register" onclick="register()">Registrarse</button>
      </div>
      <p id="auth-status"></p>
    </div>

    <!-- Panel Perfil -->
    <div id="user-panel" class="card hidden">
      <h2>Perfil de Usuario</h2>
      <p>Usuario: <strong id="user-name-display"></strong></p>
      <p>Monedas: <span id="user-coins">0</span> 🪙</p>
      
      <div style="margin-top: 15px;">
        <h3>Cambiar Biografía</h3>
        <textarea id="user-bio" placeholder="Escribe algo sobre ti..."></textarea>
        <button id="btn-save-bio" onclick="updateBio()">Guardar Biografía</button>
      </div>

      <button onclick="logout()" style="background: #ff5252; color: white; margin-top: 15px;">Cerrar Sesión</button>
    </div>

    <!-- Tienda de Accesorios -->
    <div class="card">
      <h2>Catálogo de Accesorios</h2>
      <div id="accessories-grid" class="grid"></div>
    </div>

    <!-- Panel de Administración -->
    <div id="admin-panel" class="card hidden">
      <h2>Panel Admin - Subir Accesorio (.GLB)</h2>
      <input type="text" id="acc-name" placeholder="Nombre del accesorio" />
      <input type="number" id="acc-price" placeholder="Precio en monedas" />
      <input type="file" id="acc-file" accept=".glb" />
      <button id="btn-upload" onclick="uploadAccessory()">Subir Accesorio</button>
      <p id="admin-status"></p>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function apiRequest(url, method = 'GET', body = null) {
      const headers = {};
      let options = { method, headers };
      if (body && !(body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(body);
      } else if (body) {
        options.body = body;
      }
      const res = await fetch(url, options);
      return res.json();
    }

    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const status = document.getElementById('auth-status');
      
      const data = await apiRequest('/api/login', 'POST', { username: u, password: p });
      if (data.success) {
        currentUser = data.user;
        status.className = 'success-msg';
        status.textContent = '¡Sesión iniciada!';
        updateUI();
      } else {
        status.className = 'error-msg';
        status.textContent = data.message || 'Error al iniciar sesión';
      }
    }

    async function register() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const status = document.getElementById('auth-status');

      const data = await apiRequest('/api/register', 'POST', { username: u, password: p });
      if (data.success) {
        status.className = 'success-msg';
        status.textContent = 'Registro exitoso. Ahora puedes iniciar sesión.';
      } else {
        status.className = 'error-msg';
        status.textContent = data.message || 'Error en el registro';
      }
    }

    function logout() {
      currentUser = null;
      updateUI();
    }

    function updateUI() {
      if (currentUser) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('user-panel').classList.remove('hidden');
        document.getElementById('user-name-display').textContent = currentUser.username;
        document.getElementById('user-coins').textContent = currentUser.coins;
        document.getElementById('user-bio').value = currentUser.bio || '';

        if (currentUser.isAdmin) {
          document.getElementById('admin-panel').classList.remove('hidden');
        } else {
          document.getElementById('admin-panel').classList.add('hidden');
        }
      } else {
        document.getElementById('auth-panel').classList.remove('hidden');
        document.getElementById('user-panel').classList.add('hidden');
        document.getElementById('admin-panel').classList.add('hidden');
      }
      loadAccessories();
    }

    async function updateBio() {
      const bio = document.getElementById('user-bio').value;
      const data = await apiRequest('/api/user/bio', 'POST', { username: currentUser.username, bio });
      if (data.success) {
        currentUser.bio = bio;
        alert('Biografía actualizada');
      }
    }

    async function loadAccessories() {
      const grid = document.getElementById('accessories-grid');
      grid.innerHTML = '';
      const accessories = await apiRequest('/api/accessories');

      accessories.forEach(acc => {
        const item = document.createElement('div');
        item.className = 'item-card';
        item.innerHTML = `
          <model-viewer src="${acc.fileUrl}" alt="${acc.name}" auto-rotate camera-controls></model-viewer>
          <h3>${acc.name}</h3>
          <p>Precio: ${acc.price} 🪙</p>
          <button onclick="buyAccessory('${acc.id}')" ${!currentUser ? 'disabled' : ''}>Comprar</button>
        `;
        grid.appendChild(item);
      });
    }

    async function buyAccessory(accId) {
      if (!currentUser) return;
      const data = await apiRequest('/api/buy', 'POST', { username: currentUser.username, accessoryId: accId });
      if (data.success) {
        currentUser.coins = data.newCoins;
        document.getElementById('user-coins').textContent = currentUser.coins;
        alert('¡Accesorio comprado!');
      } else {
        alert(data.message || 'No se pudo realizar la compra');
      }
    }

    async function uploadAccessory() {
      const name = document.getElementById('acc-name').value;
      const price = document.getElementById('acc-price').value;
      const fileInput = document.getElementById('acc-file');
      const status = document.getElementById('admin-status');

      if (!fileInput.files[0]) {
        status.className = 'error-msg';
        status.textContent = 'Selecciona un archivo .glb';
        return;
      }

      const formData = new FormData();
      formData.append('name', name);
      formData.append('price', price);
      formData.append('file', fileInput.files[0]);

      const data = await apiRequest('/api/admin/accessories/upload', 'POST', formData);
      if (data.success) {
        status.className = 'success-msg';
        status.textContent = 'Accesorio subido con éxito';
        loadAccessories();
      } else {
        status.className = 'error-msg';
        status.textContent = data.message || 'Error al subir accesorio';
      }
    }

    // Carga inicial
    loadAccessories();
  </script>
</body>
</html>
