<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Game Blocks - Avatar & Tienda</title>
<!-- Three.js y GLTFLoader para visualización 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; }

.topbar {
    position: fixed; top: 0; left: 0; width: 100%; height: 65px;
    background: #111; border-bottom: 2px solid #292929;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 1000;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }

.top-button {
    background: #fff; color: #000; padding: 9px 16px; border: 0;
    border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none;
}

.coin-display {
    background: #1a1a1a; color: #ffd700; border: 1px solid #333;
    padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer;
}

/* Visor 3D de Avatar */
#avatar-container {
    width: 300px; height: 350px; background: #151515;
    border: 1px solid #333; border-radius: 8px; margin: 80px auto 20px;
}

.panel {
    max-width: 600px; margin: 20px auto; background: #111;
    border: 1px solid #333; padding: 20px; border-radius: 8px;
}

input, select, button {
    width: 100%; padding: 10px; margin: 6px 0 12px;
    background: #050505; color: #fff; border: 1px solid #444; border-radius: 5px;
}

button { background: #fff; color: #000; font-weight: bold; cursor: pointer; }

/* Banner Inferior */
.bottom-banner {
    position: fixed; bottom: 0; left: 0; width: 100%; background: #1b1b1b;
    border-top: 1px solid #444; text-align: center; padding: 10px; font-weight: bold;
}

.grid-shop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.shop-item { border: 1px solid #333; padding: 10px; text-align: center; background: #080808; }
</style>
</head>
<body>

<div class="topbar">
    <div><strong>Game Blocks</strong></div>
    <div class="topbar-right">
        <div id="userCoins" class="coin-display" onclick="alert('Próximamente')">0 🪙</div>
        <!-- Botón de Avatar a la derecha de las monedas -->
        <button class="top-button" onclick="scrollToAvatar()">👕 Avatar</button>
        <a class="top-button" href="#">Descargar</a>
    </div>
</div>

<!-- Visualizador 3D -->
<div id="avatar-container"></div>

<!-- Panel Owner / Subir Sombrero GLB -->
<div class="panel">
    <h3>👑 Panel Owner - Subir Accesorio Sombrero (.GLB)</h3>
    <input type="text" id="itemName" placeholder="Nombre del accesorio">
    <label>Archivo GLB desde el PC:</label>
    <input type="file" id="itemGlb" accept=".glb">
    
    <label>¿Es Limited?</label>
    <select id="itemLimited" onchange="toggleLimitedFields()">
        <option value="false">No</option>
        <option value="true">Sí</option>
    </select>

    <div id="limitedFields" style="display:none;">
        <input type="number" id="itemCopies" placeholder="Copias totales">
        <input type="number" id="itemMaxUser" placeholder="Máximo por usuario">
    </div>

    <input type="number" id="itemPrice" placeholder="Precio en monedas">
    <button onclick="uploadGlbItem()">Subir Accesorio GLB</button>
</div>

<!-- Panel Admin - Añadir Monedas & Banner -->
<div class="panel">
    <h3>⚙️ Admin - Gestión de Economía y Banner</h3>
    <input type="text" id="coinUser" placeholder="Usuario">
    <input type="number" id="coinAmount" placeholder="Cantidad de monedas">
    <button onclick="addCoins()">Añadir Monedas</button>

    <hr style="border-color:#333; margin: 15px 0;">

    <input type="text" id="bannerInput" placeholder="Texto del Banner inferior">
    <button onclick="updateBanner()">Establecer Banner</button>
</div>

<!-- Tienda de Accesorios -->
<div class="panel">
    <h3>🛒 Tienda de Accesorios</h3>
    <div id="shopContainer" class="grid-shop"></div>
</div>

<!-- Banner de Texto Inferior -->
<div id="siteBanner" class="bottom-banner">Cargando banner...</div>

<script>
// --- CONFIGURACIÓN THREE.JS (VISOR 3D ESTÁTICO) ---
const container = document.getElementById('avatar-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151515);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 1.2, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(2, 4, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

let baseModel = null;
let currentHat = null;
const loader = new THREE.GLTFLoader();

// Cargar modelo base noob.glb desde el repositorio/servidor
loader.load('noob.glb', (gltf) => {
    baseModel = gltf.scene;
    baseModel.position.set(0, 0, 0);
    scene.add(baseModel);
}, undefined, (error) => {
    console.log('Asegúrate de tener noob.glb en el directorio raíz:', error);
});

// Render estático sin rotación
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

// Añadir accesorio GLB encima del avatar
function equipHat(glbUrl) {
    if (currentHat) scene.remove(currentHat);

    loader.load(glbUrl, (gltf) => {
        currentHat = gltf.scene;
        // Ajuste de posición sobre la cabeza del noob
        currentHat.position.set(0, 0.75, 0); 
        scene.add(currentHat);
    });
}

// --- LÓGICA DE INTERFAZ Y COMUNICACIÓN CON SERVIDOR ---
function toggleLimitedFields() {
    const isLimited = document.getElementById('itemLimited').value === 'true';
    document.getElementById('limitedFields').style.display = isLimited ? 'block' : 'none';
}

function scrollToAvatar() {
    container.scrollIntoView({ behavior: 'smooth' });
}

async function uploadGlbItem() {
    const fileInput = document.getElementById('itemGlb');
    if (!fileInput.files[0]) return alert("Selecciona un archivo .glb");

    const formData = new FormData();
    formData.append('name', document.getElementById('itemName').value);
    formData.append('glbFile', fileInput.files[0]);
    formData.append('isLimited', document.getElementById('itemLimited').value);
    formData.append('copies', document.getElementById('itemCopies').value);
    formData.append('maxPerUser', document.getElementById('itemMaxUser').value);
    formData.append('price', document.getElementById('itemPrice').value);

    const res = await fetch('/api/admin/upload-item', { method: 'POST', body: formData });
    const data = await res.json();
    alert(data.message);
    loadShop();
}

async function addCoins() {
    const username = document.getElementById('coinUser').value;
    const amount = document.getElementById('coinAmount').value;
    const res = await fetch('/api/admin/add-coins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, amount })
    });
    const data = await res.json();
    alert(data.message);
}

async function updateBanner() {
    const text = document.getElementById('bannerInput').value;
    const res = await fetch('/api/admin/banner', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
    });
    const data = await res.json();
    document.getElementById('siteBanner').textContent = data.banner;
}

async function loadShop() {
    const res = await fetch('/api/shop/items');
    const data = await res.json();
    const container = document.getElementById('shopContainer');
    container.innerHTML = '';

    data.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `
            <strong>${item.name}</strong><br>
            🪙 ${item.price} Monedas<br>
            ${item.isLimited ? `<small>Limited (${item.copies} copias)</small><br>` : ''}
            <button onclick="equipHat('${item.glbUrl}')">Probar Sombrero</button>
        `;
        container.appendChild(div);
    });
}

// Carga inicial
fetch('/api/banner').then(res => res.json()).then(d => {
    document.getElementById('siteBanner').textContent = d.banner;
});
loadShop();
</script>
</body>
</html>
