<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game Blocks</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1f1f1f; }
        .search-bar { width: 300px; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .profile-card { background: #1f1f1f; padding: 20px; border-radius: 8px; text-align: center; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #444; }
        .username { font-size: 2em; margin: 10px 0 5px 0; font-weight: bold; }
        .badge { font-size: 1.2em; margin-left: 5px; }
        .bio { margin: 15px 0; color: #ccc; }
        .friends-section { margin-top: 30px; text-align: left; }
        .friend-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: #2a2a2a; margin-bottom: 5px; border-radius: 4px; }
        .friend-avatar { width: 40px; height: 40px; border-radius: 50%; }
    </style>
</head>
<body>

<header>
    <h2>Game Blocks</h2>
    <input type="text" id="globalSearch" class="search-bar" placeholder="Buscar usuarios..." oninput="searchUsers()">
</header>

<div class="container">
    <div id="searchResults" style="display:none; margin-bottom: 20px;"></div>

    <div class="profile-card" id="profileView">
        <input type="file" id="avatarInput" style="display:none" accept="image/*" onchange="uploadAvatar(event)">
        <img id="profileAvatar" src="https://via.placeholder.com/120" class="avatar" onclick="triggerAvatarUpload()">
        
        <div>
            <span id="profileUsername" class="username"></span>
            <span id="profileBadges"></span>
        </div>

        <p id="profileBio" class="bio"></p>
        <button id="editBioBtn" onclick="editBio()">Editar Bio</button>

        <div class="friends-section">
            <h3>Amigos</h3>
            <div id="friendsList"></div>
        </div>
    </div>
</div>

<script>
    const BADGE_ICONS = {
        server_booster: "⭐",
        admin: "🛡️",
        game_blocks: "🟥",
        creator_content: "▶️"
    };

    let currentUser = null;

    async function loadProfile() {
        const res = await fetch("/api/me", {
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
        });
        if (res.ok) {
            currentUser = await res.json();
            renderProfile(currentUser, true);
            loadFriends();
        }
    }

    function renderProfile(user, isOwner) {
        document.getElementById("profileUsername").innerText = user.username;
        document.getElementById("profileBio").innerText = user.bio || "Sin biografía.";
        document.getElementById("profileAvatar").src = user.avatar || "https://via.placeholder.com/120";
        document.getElementById("editBioBtn").style.display = isOwner ? "inline-block" : "none";

        const badgesContainer = document.getElementById("profileBadges");
        badgesContainer.innerHTML = "";
        (user.badges || []).forEach(b => {
            if (BADGE_ICONS[b]) {
                const span = document.createElement("span");
                span.className = "badge";
                span.innerText = BADGE_ICONS[b];
                badgesContainer.appendChild(span);
            }
        });
    }

    function triggerAvatarUpload() {
        document.getElementById("avatarInput").click();
    }

    function uploadAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;
            const res = await fetch("/api/profile/update", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify({ avatar: base64 })
            });
            if (res.ok) {
                currentUser.avatar = base64;
                document.getElementById("profileAvatar").src = base64;
            }
        };
        reader.readAsDataURL(file);
    }

    async function editBio() {
        const newBio = prompt("Escribe tu nueva biografía:", currentUser.bio || "");
        if (newBio !== null) {
            const res = await fetch("/api/profile/update", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify({ bio: newBio })
            });
            if (res.ok) {
                currentUser.bio = newBio;
                document.getElementById("profileBio").innerText = newBio;
            }
        }
    }

    async function loadFriends() {
        const res = await fetch("/api/friends", {
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
        });
        if (res.ok) {
            const data = await res.json();
            const list = document.getElementById("friendsList");
            list.innerHTML = "";
            data.friends.forEach(f => {
                const item = document.createElement("div");
                item.className = "friend-item";
                item.innerHTML = `
                    <img src="${f.avatar || 'https://via.placeholder.com/40'}" class="friend-avatar">
                    <span>${f.username}</span>
                `;
                list.appendChild(item);
            });
        }
    }

    async function searchUsers() {
        const query = document.getElementById("globalSearch").value;
        const resultsDiv = document.getElementById("searchResults");
        if (!query.trim()) {
            resultsDiv.style.display = "none";
            return;
        }
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`, {
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
        });
        if (res.ok) {
            const data = await res.json();
            resultsDiv.style.display = "block";
            resultsDiv.innerHTML = "<h3>Resultados:</h3>";
            data.users.forEach(u => {
                const div = document.createElement("div");
                div.className = "friend-item";
                div.innerHTML = `<img src="${u.avatar || 'https://via.placeholder.com/40'}" class="friend-avatar"> <b>${u.username}</b>`;
                resultsDiv.appendChild(div);
            });
        }
    }

    loadProfile();
</script>
</body>
</html>
