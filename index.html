<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game Blocks</title>
    <!-- Carga del visor 3D Model-Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        .nav-bar { display: flex; align-items: center; gap: 10px; background: #222; color: #fff; padding: 10px; }
        .avatar-btn { cursor: pointer; padding: 5px 10px; background: #008cba; color: white; border: none; border-radius: 4px; }
        .viewer-container { position: relative; width: 300px; height: 400px; background: #eee; margin-top: 20px; }
        /* El visualizador NO gira y el accesorio se posiciona arriba */
        model-viewer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #accessoryViewer { pointer-events: none; } /* Para no interferir */
        .sidebar { width: 250px; background: #f4f4f4; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; height: 300px; }
        .banner-text { background: #ffeb3b; padding: 8px; font-weight: bold; text-align: center; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="nav-bar">
        <button>Descargar</button>
        <span>Monedas: <strong id="userCoins">0</strong></span>
        <!-- Botón de Avatar a la derecha de monedas -->
        <button class="avatar-btn" onclick="toggleAvatarModal()">Avatar</button>
    </div>

    <!-- CONTENEDOR DE VISUALIZACIÓN DE MODELO 3D -->
    <div class="viewer-container">
        <!-- Modelo base estático (no-rotate) desde archivos del proyecto -->
        <model-viewer id="baseAvatar" src="noob.glb" alt="Avatar Base" interaction-prompt="none"></model-viewer>
        <!-- Accesorio posicionado superpuesto -->
        <model-viewer id="accessoryViewer" src="" alt="Accesorio" interaction-prompt="none"></model-viewer>
    </div>

    <!-- BARRA LATERAL CON BANNER -->
    <div class="sidebar">
        <div>
            <h3>Navegación</h3>
            <!-- Menú lateral -->
        </div>
        <!-- Banner de texto abajo de la barra lateral -->
        <div id="sidebarBanner" class="banner-text" style="display:none;"></div>
    </div>

    <!-- PANEL DE ADMINISTRADOR/OWNER -->
    <div id="adminPanel" style="display:none; border:1px solid #ccc; padding:15px; margin-top:20px;">
        <h3>Panel del Owner</h3>
        
        <h4>Subir Accesorio (.GLB local + PNG por enlace)</h4>
        <form id="uploadAccForm">
            <label>Archivo GLB (desde PC):</label>
            <input type="file" id="glbFileInput" accept=".glb" required><br><br>
            
            <label>URL Icono PNG:</label>
            <input type="url" id="iconUrlInput" placeholder="https://ejemplo.com/icono.png"><br><br>

            <label>Es Limitado:</label>
            <select id="isLimitedInput">
                <option value="false">No</option>
                <option value="true">Sí</option>
            </select><br><br>

            <label>Máximo copias (si es limitado):</label>
            <input type="number" id="maxCopiesInput" value="10"><br><br>

            <label>Precio (monedas):</label>
            <input type="number" id="priceInput" value="0" required><br><br>

            <button type="submit">Publicar Accesorio</button>
        </form>

        <hr>
        <h4>Añadir Monedas a Usuario</h4>
        <input type="text" id="targetUserCoins" placeholder="Nombre de usuario">
        <input type="number" id="coinsAmount" placeholder="Cantidad">
        <button onclick="addCoins()">Dar Monedas</button>

        <hr>
        <h4>Establecer Banner Inferior</h4>
        <input type="text" id="bannerTextInput" placeholder="Texto del banner">
        <button onclick="updateBanner()">Guardar Banner</button>
    </div>

    <script>
        const API_URL = "https://tu-app-en-render.onrender.com/api"; // Sustituir por tu URL de Render
        let token = localStorage.getItem("token");

        // Cargar datos iniciales
        async function init() {
            if (!token) return;
            
            const res = await fetch(`${API_URL}/me`, { headers: { "Authorization": `Bearer ${token}` } });
            const data = await res.json();

            if (data.username) {
                document.getElementById("userCoins").innerText = data.coins;
                if (data.admin) {
                    document.getElementById("adminPanel").style.display = "block";
                }
                if (data.equippedAccessory) {
                    document.getElementById("accessoryViewer").setAttribute("src", `${API_URL.replace('/api','')}${data.equippedAccessory}`);
                }
            }

            // Cargar banner
            const resBanner = await fetch(`${API_URL}/banner`);
            const dataBanner = await resBanner.json();
            if (dataBanner.bannerText) {
                const bElem = document.getElementById("sidebarBanner");
                bElem.innerText = dataBanner.bannerText;
                bElem.style.display = "block";
            }
        }

        // Subir accesorio mediante Form-Data (Soporta archivo local)
        document.getElementById("uploadAccForm").onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append("glbFile", document.getElementById("glbFileInput").files[0]);
            formData.append("iconUrl", document.getElementById("iconUrlInput").value);
            formData.append("isLimited", document.getElementById("isLimitedInput").value);
            formData.append("maxCopies", document.getElementById("maxCopiesInput").value);
            formData.append("price", document.getElementById("priceInput").value);

            const res = await fetch(`${API_URL}/admin/accessories`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` },
                body: formData
            });

            const data = await res.json();
            alert(data.message || data.error);
        };

        async function addCoins() {
            const username = document.getElementById("targetUserCoins").value;
            const amount = document.getElementById("coinsAmount").value;

            const res = await fetch(`${API_URL}/admin/add-coins`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ username, amount })
            });

            const data = await res.json();
            alert(data.message || data.error);
        }

        async function updateBanner() {
            const text = document.getElementById("bannerTextInput").value;

            const res = await fetch(`${API_URL}/admin/banner`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ text })
            });

            const data = await res.json();
            if (data.bannerText !== undefined) {
                const bElem = document.getElementById("sidebarBanner");
                bElem.innerText = data.bannerText;
                bElem.style.display = "block";
            }
        }

        init();
    </script>
</body>
</html>
