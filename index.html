<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Blocks</title>
<!-- Librería para Renderizar Modelos 3D GLB -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; }

.topbar {
    position: fixed; top: 0; left: 0; width: 100%; height: 65px;
    background: #111; border-bottom: 2px solid #292929;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 1000;
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }

.coin-display {
    background: #1a1a1a; color: #ffd700; border: 1px solid #333;
    padding: 8px 14px; border-radius: 20px; font-size: 15px; font-weight: bold;
    display: flex; align-items: center; gap: 5px;
}

.top-button {
    background: #fff; color: #000; padding: 9px 16px; border: 0;
    border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none;
}

/* Modal Avatar / Editor */
.avatar-modal-body {
    display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px;
}
.avatar-viewer-box {
    width: 250px; height: 300px; background: #050505; border: 1px solid #333;
    border-radius: 8px; position: relative;
}
model-viewer { width: 100%; height: 100%; }

.shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; width: 100%; }
.shop-card { background: #181818; border: 1px solid #333; padding: 10px; border-radius: 6px; text-align: center; }
.shop-card img { width: 100%; height: 80px; object-fit: contain; }

/* Banner Lateral Owner */
.sidebar-banner {
    margin-top: 15px; padding: 10px; background: #1a1100; border: 1px solid #ffd700;
    border-radius: 6px; font-size: 13px; color: #ffd700; text-align: center;
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <button class="top-button" style="background: #28a745; color: #fff;" onclick="launchGame()">▶️ Abrir</button>
    </div>
    <div class="topbar-right">
        <!-- Monedas -->
        <div class="coin-display" id="userCoins">0 🪙</div>
        <!-- Botón Avatar a la derecha de monedas y a la izquierda de Descargar -->
        <button class="top-button" style="background: #7a4cff; color: #fff;" onclick="openAvatarModal()">🎭 Avatar</button>
        <a class="top-button" href="https://pablopalo2014.itch.io/game-blocks">Descargar</a>
        <button id="accountButton" class="top-button hidden" onclick="openAccount()">👤 Mi Cuenta</button>
    </div>
</div>

<!-- MODAL EDITOR DE AVATAR Y TIENDA -->
<div id="avatarModal" class="modal" style="display:none;">
    <div class="modal-box" style="max-width: 700px;">
        <button class="close" onclick="closeAvatarModal()">×</button>
        <h2>🎭 Editor de Avatar y Tienda</h2>
        
        <div class="avatar-modal-body">
            <!-- Visualizador Base -->
            <div class="avatar-viewer-box">
                <!-- Visualizador del modelo noob.glb (Sin rotación automática) -->
                <model-viewer id="baseModel" src="noob.glb" alt="Avatar" style="position:absolute; z-index:1;"></model-viewer>
                <!-- Overlay del Accesorio Equipado -->
                <model-viewer id="accessoryModel" src="" alt="Accesorio" style="position:absolute; z-index:2; pointer-events:none;"></model-viewer>
            </div>

            <!-- Tienda de Accesorios -->
            <div style="flex: 1;">
                <h3>🛒 Tienda de Accesorios</h3>
                <div id="shopList" class="shop-items">Cargando accesorios...</div>
            </div>
        </div>

        <!-- Banner de texto configurado por el Owner (Abajo del panel) -->
        <div id="sidebarBanner" class="sidebar-banner hidden"></div>
    </div>
</div>

<!-- DENTRO DEL PANEL ADMIN DE TU MODAL DE CUENTA -->
<div id="adminPanelModal" class="admin-panel hidden">
    <h2>🛠️ Panel de Administración (Owner)</h2>
    
    <!-- Subir Accesorio GLB local + PNG por enlace -->
    <div class="section">
        <h3>📦 Subir Nuevo Accesorio</h3>
        <label>Modelo (.glb desde archivos de PC):</label>
        <input type="file" id="adminGlbFile" accept=".glb">
        
        <label>Vista previa (PNG desde enlace):</label>
        <input type="text" id="adminPngUrl" placeholder="https://ejemplo.com/icono.png">

        <label>¿Es Limited?:</label>
        <select id="adminIsLimited">
            <option value="false">No</option>
            <option value="true">Sí</option>
        </select>
        
        <input type="number" id="adminMaxCopies" placeholder="Máximo de copias por usuario (ej. 1)">
        <input type="number" id="adminPrice" placeholder="Precio en Monedas">
        <button class="admin-button" onclick="uploadAccessory()">Publicar Accesorio</button>
    </div>

    <!-- Añadir Monedas a Usuarios -->
    <div class="section">
        <h3>🪙 Dar Monedas a Usuario</h3>
        <input type="text" id="adminCoinUser" placeholder="Nombre de usuario">
        <input type="number" id="adminCoinAmount" placeholder="Cantidad de monedas">
        <button class="admin-button" onclick="adminAddCoins()">Añadir Monedas</button>
    </div>

    <!-- Banner de texto para sidebar -->
    <div class="section">
        <h3>📢 Banner Informativo Abajo</h3>
        <input type="text" id="adminBannerText" placeholder="Escribe el texto del banner...">
        <button class="admin-button" onclick="saveBanner()">Guardar Banner</button>
    </div>
</div>

<script>
const RENDER_API = "https://panstudios-github-io-1.onrender.com";

// Abrir/Cerrar Modal de Avatar
function openAvatarModal() {
    document.getElementById("avatarModal").style.display = "flex";
    loadShop();
    loadBanner();
}
function closeAvatarModal() {
    document.getElementById("avatarModal").style.display = "none";
}

// Cargar Tienda de Accesorios
async function loadShop() {
    const shopList = document.getElementById("shopList");
    try {
        const items = await request("/api/accessories");
        shopList.innerHTML = "";
        items.forEach(item => {
            const card = document.createElement("div");
            card.className = "shop-card";
            card.innerHTML = `
                <img src="${item.imageUrl}" alt="${item.name}">
                <div><b>${item.price} 🪙</b></div>
                ${item.limited ? `<small style="color:red;">Limitado</small><br>` : ''}
                <button class="form-button" style="padding:4px; margin-top:5px;" onclick="equipAccessory('${item.glbUrl}')">Equipar</button>
            `;
            shopList.appendChild(card);
        });
    } catch {
        shopList.textContent = "Error al cargar la tienda.";
    }
}

// Añadir accesorio sobre el personaje sin rotación
function equipAccessory(glbUrl) {
    const accViewer = document.getElementById("accessoryModel");
    accViewer.src = glbUrl;
}

// Panel Admin: Subir Accesorio local + datos
async function uploadAccessory() {
    const fileInput = document.getElementById("adminGlbFile");
    const pngUrl = document.getElementById("adminPngUrl").value;
    const isLimited = document.getElementById("adminIsLimited").value === "true";
    const maxCopies = document.getElementById("adminMaxCopies").value;
    const price = document.getElementById("adminPrice").value;

    if (!fileInput.files[0] || !pngUrl || !price) {
        alert("Completa todos los campos obligatorios.");
        return;
    }

    const formData = new FormData();
    formData.append("glb", fileInput.files[0]);
    formData.append("imageUrl", pngUrl);
    formData.append("limited", isLimited);
    formData.append("maxCopies", maxCopies);
    formData.append("price", price);

    const token = localStorage.getItem("gameblocks_token");
    const response = await fetch(RENDER_API + "/api/admin/accessories", {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: formData
    });

    if (response.ok) {
        alert("Accesorio subido con éxito");
        loadShop();
    } else {
        alert("Error al subir accesorio.");
    }
}

// Dar monedas a usuario
async function adminAddCoins() {
    const username = document.getElementById("adminCoinUser").value;
    const amount = document.getElementById("adminCoinAmount").value;
    try {
        await request("/api/admin/add-coins", "POST", { username, amount: parseInt(amount) });
        alert("Monedas añadidas correctamente.");
    } catch (e) {
        alert(e.message);
    }
}

// Guardar y Cargar Banner
async function saveBanner() {
    const text = document.getElementById("adminBannerText").value;
    await request("/api/admin/banner", "POST", { text });
    alert("Banner actualizado.");
    loadBanner();
}

async function loadBanner() {
    try {
        const data = await request("/api/banner");
        const banner = document.getElementById("sidebarBanner");
        if (data.text) {
            banner.textContent = data.text;
            banner.classList.remove("hidden");
        }
    } catch {}
}
</script>
</body>
</html>
