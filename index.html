<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game Blocks</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #000;

            color: #fff;

            font-family: Arial, sans-serif;
        }


        /* =========================
           TOPBAR
        ========================= */

        .topbar {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 65px;

            background: #111;

            border-bottom: 2px solid #292929;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            z-index: 1000;
        }


        .topbar-left,
        .topbar-right {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .top-button {

            background: #fff;

            color: #000;

            padding: 11px 20px;

            border: 0;

            border-radius: 5px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
        }


        .top-button:hover {

            background: #ddd;
        }


        /* =========================
           HERO
        ========================= */

        .hero {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 80px 20px 20px;
        }


        .logo {

            width: 300px;

            max-width: 80%;

            margin-bottom: 45px;
        }


        .slogan {

            font-size: 52px;

            margin: 0;

            font-weight: bold;
        }


        /* =========================
           FEATURES
        ========================= */

        .features {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 80px 20px;

            background: #080808;

            border-top: 2px solid #222;
        }


        .features h2 {

            font-size: 36px;

            margin-bottom: 45px;
        }


        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

            max-width: 900px;
        }


        .button {

            padding: 16px 25px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

            border: none;

            cursor: pointer;
        }


        .download-button {

            background: #fff;

            color: #000;
        }


        .discord-button {

            background: #5865F2;

            color: #fff;
        }


        .avatar-button {

            background: #151515;

            color: #fff;

            border: 1px solid #444;
        }


        .small-text {

            margin-top: 55px;

            color: #777;

            font-size: 14px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.85);

            justify-content: center;

            align-items: center;

            z-index: 2000;

            padding: 20px;
        }


        .modal-box {

            width: 100%;

            max-width: 520px;

            max-height: 90vh;

            overflow-y: auto;

            background: #111;

            border: 1px solid #333;

            border-radius: 10px;

            padding: 25px;

            box-shadow: 0 0 30px #000;
        }


        .close {

            float: right;

            background: transparent;

            color: #aaa;

            border: none;

            font-size: 28px;

            cursor: pointer;
        }


        .close:hover {

            color: #fff;
        }


        input {

            width: 100%;

            padding: 13px;

            margin: 7px 0 12px;

            background: #050505;

            color: #fff;

            border: 1px solid #444;

            border-radius: 5px;

            outline: none;
        }


        input:focus {

            border-color: #fff;
        }


        .form-button {

            width: 100%;

            padding: 13px;

            background: #fff;

            color: #000;

            border: none;

            border-radius: 5px;

            font-weight: bold;

            cursor: pointer;
        }


        .secondary-button {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            background: #191919;

            color: #fff;

            border: 1px solid #444;

            border-radius: 5px;

            cursor: pointer;
        }


        .danger-button {

            background: #641b1b;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }


        .friend-button {

            background: #222;

            color: white;

            border: 1px solid #444;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }


        .result {

            background: #181818;

            border: 1px solid #333;

            border-radius: 6px;

            padding: 12px;

            margin-top: 8px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;
        }


        .section {

            margin-top: 25px;
        }


        .error {

            color: #ff5555;
        }


        .success {

            color: #55dd77;
        }


        .hidden {

            display: none;
        }

    </style>

</head>


<body>


    <!-- TOPBAR -->

    <div class="topbar">

        <div class="topbar-left">

            <a
                class="top-button"
                href="https://pablopalo2014.itch.io/game-blocks"
            >
                Descargar
            </a>

        </div>


        <div class="topbar-right">

            <button
                id="accountButton"
                class="top-button"
                onclick="openAccount()"
            >
                👤 Cuenta
            </button>

        </div>

    </div>


    <!-- HERO -->

    <section class="hero">

        <img
            class="logo"
            src="game blocks logo(1).png"
            alt="Game Blocks Logo"
        >


        <h1 class="slogan">
            Potenciando la construccion
        </h1>

    </section>


    <!-- FEATURES -->

    <section class="features">

        <h2>
            Game Blocks
        </h2>


        <div class="buttons">

            <a
                class="button download-button"
                href="https://pablopalo2014.itch.io/game-blocks"
            >
                ⬇️ Descargar Game Blocks
            </a>


            <a
                class="button discord-button"
                href="https://discord.gg/Up24N45SK3"
                target="_blank"
            >
                💬 Unirse al Discord
            </a>


            <button
                class="button avatar-button"
                onclick="openAccount()"
            >
                👤 Mi cuenta
            </button>

        </div>


        <p class="small-text">
            Más cosas están por llegar...
        </p>

    </section>


    <!-- CUENTA -->

    <div
        id="accountModal"
        class="modal"
        onclick="outsideClose(event)"
    >

        <div class="modal-box">

            <button
                class="close"
                onclick="closeAccount()"
            >
                ×
            </button>


            <!-- LOGIN -->

            <div id="loginView">

                <h2>
                    Iniciar sesión
                </h2>


                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Nombre de usuario"
                    maxlength="20"
                >


                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Contraseña"
                >


                <button
                    class="form-button"
                    onclick="login()"
                >
                    Iniciar sesión
                </button>


                <button
                    class="secondary-button"
                    onclick="showRegister()"
                >
                    Crear cuenta
                </button>


                <p id="loginMessage"></p>

            </div>


            <!-- REGISTER -->

            <div
                id="registerView"
                class="hidden"
            >

                <h2>
                    Crear cuenta
                </h2>


                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Nombre de usuario"
                    maxlength="20"
                >


                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Contraseña"
                >


                <input
                    id="registerPassword2"
                    type="password"
                    placeholder="Repetir contraseña"
                >


                <button
                    class="form-button"
                    onclick="register()"
                >
                    Crear cuenta
                </button>


                <button
                    class="secondary-button"
                    onclick="showLogin()"
                >
                    Ya tengo una cuenta
                </button>


                <p id="registerMessage"></p>

            </div>


            <!-- CUENTA LOGUEADA -->

            <div
                id="accountView"
                class="hidden"
            >

                <h2 id="welcome">
                    Mi cuenta
                </h2>


                <!-- BUSCAR -->

                <div class="section">

                    <h3>
                        🔎 Buscar cuentas
                    </h3>


                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Buscar usuario..."
                    >


                    <button
                        class="form-button"
                        onclick="searchUsers()"
                    >
                        Buscar
                    </button>


                    <div id="searchResults"></div>

                </div>


                <!-- SOLICITUDES -->

                <div class="section">

                    <h3>
                        👥 Solicitudes
                    </h3>


                    <div id="requests">
                        Cargando...
                    </div>

                </div>


                <!-- AMIGOS -->

                <div class="section">

                    <h3>
                        ⭐ Amigos
                    </h3>


                    <div id="friends">
                        Cargando...
                    </div>

                </div>


                <button
                    class="secondary-button"
                    onclick="logout()"
                >
                    Cerrar sesión
                </button>

            </div>

        </div>

    </div>


    <script>

        // =====================================================
        // RENDER
        // =====================================================

        const RENDER_API =
            "https://panstudios-github-io-1.onrender.com";


        // =====================================================
        // PETICIONES AL SERVIDOR
        // =====================================================

        async function request(
            endpoint,
            method = "GET",
            body = null
        ) {

            const headers = {
                "Content-Type": "application/json"
            };


            const token =
                localStorage.getItem(
                    "gameblocks_token"
                );


            if (token) {

                headers.Authorization =
                    "Bearer " + token;

            }


            const options = {

                method: method,

                headers: headers

            };


            if (body !== null) {

                options.body =
                    JSON.stringify(body);

            }


            const response =
                await fetch(
                    RENDER_API + endpoint,
                    options
                );


            let data;


            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "El servidor devolvió una respuesta inválida."
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Error del servidor."
                );

            }


            return data;
        }


        // =====================================================
        // MODAL
        // =====================================================

        function openAccount() {

            document.getElementById(
                "accountModal"
            ).style.display = "flex";


            updateAccount();

        }


        function closeAccount() {

            document.getElementById(
                "accountModal"
            ).style.display = "none";

        }


        function outsideClose(event) {

            if (
                event.target.id ===
                "accountModal"
            ) {

                closeAccount();

            }

        }


        // =====================================================
        // CAMBIAR VISTAS
        // =====================================================

        function showLogin() {

            document.getElementById(
                "loginView"
            ).classList.remove("hidden");


            document.getElementById(
                "registerView"
            ).classList.add("hidden");


            document.getElementById(
                "accountView"
            ).classList.add("hidden");

        }


        function showRegister() {

            document.getElementById(
                "loginView"
            ).classList.add("hidden");


            document.getElementById(
                "registerView"
            ).classList.remove("hidden");


            document.getElementById(
                "accountView"
            ).classList.add("hidden");

        }


        function showAccount() {

            document.getElementById(
                "loginView"
            ).classList.add("hidden");


            document.getElementById(
                "registerView"
            ).classList.add("hidden");


            document.getElementById(
                "accountView"
            ).classList.remove("hidden");

        }


        // =====================================================
        // REGISTRO
        // =====================================================

        async function register() {

            const username =
                document.getElementById(
                    "registerUsername"
                ).value.trim();


            const password =
                document.getElementById(
                    "registerPassword"
                ).value;


            const password2 =
                document.getElementById(
                    "registerPassword2"
                ).value;


            const message =
                document.getElementById(
                    "registerMessage"
                );


            message.className = "";


            if (
                !username ||
                !password ||
                !password2
            ) {

                message.className =
                    "error";

                message.textContent =
                    "Completa todos los campos.";

                return;
            }


            if (password !== password2) {

                message.className =
                    "error";

                message.textContent =
                    "Las contraseñas no coinciden.";

                return;
            }


            try {

                message.textContent =
                    "Creando cuenta...";


                const data =
                    await request(
                        "/api/register",
                        "POST",
                        {
                            username,
                            password
                        }
                    );


                localStorage.setItem(
                    "gameblocks_token",
                    data.token
                );


                await updateAccount();


            } catch (error) {

                message.className =
                    "error";

                message.textContent =
                    error.message;

            }

        }


        // =====================================================
        // LOGIN
        // =====================================================

        async function login() {

            const username =
                document.getElementById(
                    "loginUsername"
                ).value.trim();


            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            message.className = "";


            try {

                message.textContent =
                    "Iniciando sesión...";


                const data =
                    await request(
                        "/api/login",
                        "POST",
                        {
                            username,
                            password
                        }
                    );


                localStorage.setItem(
                    "gameblocks_token",
                    data.token
                );


                await updateAccount();


            } catch (error) {

                message.className =
                    "error";

                message.textContent =
                    error.message;

            }

        }


        // =====================================================
        // CUENTA ACTUAL
        // =====================================================

        async function updateAccount() {

            const token =
                localStorage.getItem(
                    "gameblocks_token"
                );


            if (!token) {

                showLogin();

                document.getElementById(
                    "accountButton"
                ).textContent =
                    "👤 Cuenta";

                return;
            }


            try {

                const user =
                    await request(
                        "/api/me"
                    );


                showAccount();


                document.getElementById(
                    "welcome"
                ).textContent =
                    "👤 " + user.username;


                document.getElementById(
                    "accountButton"
                ).textContent =
                    "👤 " + user.username;


                loadFriends();

                loadRequests();


            } catch {

                localStorage.removeItem(
                    "gameblocks_token"
                );


                showLogin();


                document.getElementById(
                    "accountButton"
                ).textContent =
                    "👤 Cuenta";

            }

        }


        // =====================================================
        // LOGOUT
        // =====================================================

        async function logout() {

            try {

                await request(
                    "/api/logout",
                    "POST"
                );

            } catch {

                // Aunque el servidor falle,
                // cerramos la sesión local.
            }


            localStorage.removeItem(
                "gameblocks_token"
            );


            document.getElementById(
                "accountButton"
            ).textContent =
                "👤 Cuenta";


            showLogin();

        }


        // =====================================================
        // BUSCAR
        // =====================================================

        async function searchUsers() {

            const query =
                document.getElementById(
                    "searchInput"
                ).value.trim();


            const results =
                document.getElementById(
                    "searchResults"
                );


            if (!query) {

                results.textContent =
                    "Escribe algo para buscar.";

                return;
            }


            results.textContent =
                "Buscando...";


            try {

                const data =
                    await request(
                        "/api/users/search?q=" +
                        encodeURIComponent(query)
                    );


                results.innerHTML = "";


                if (
                    data.users.length === 0
                ) {

                    results.textContent =
                        "No se encontraron usuarios.";

                    return;
                }


                data.users.forEach(user => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "result";


                    const name =
                        document.createElement(
                            "span"
                        );


                    name.textContent =
                        "👤 " + user.username;


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "friend-button";


                    button.textContent =
                        "Añadir";


                    button.onclick =
                        () =>
                            sendFriendRequest(
                                user.id
                            );


                    div.appendChild(name);

                    div.appendChild(button);

                    results.appendChild(div);

                });


            } catch (error) {

                results.textContent =
                    error.message;

            }

        }


        // =====================================================
        // SOLICITUD DE AMISTAD
        // =====================================================

        async function sendFriendRequest(
            userId
        ) {

            try {

                await request(
                    "/api/friends/request",
                    "POST",
                    {
                        userId
                    }
                );


                alert(
                    "Solicitud enviada."
                );


            } catch (error) {

                alert(
                    error.message
                );

            }

        }


        // =====================================================
        // SOLICITUDES
        // =====================================================

        async function loadRequests() {

            const container =
                document.getElementById(
                    "requests"
                );


            try {

                const data =
                    await request(
                        "/api/friends/requests"
                    );


                container.innerHTML = "";


                if (
                    data.requests.length === 0
                ) {

                    container.textContent =
                        "No tienes solicitudes.";

                    return;
                }


                data.requests.forEach(
                    requestData => {

                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            "result";


                        const name =
                            document.createElement(
                                "span"
                            );


                        name.textContent =
                            "👤 " +
                            requestData.username;


                        const buttons =
                            document.createElement(
                                "div"
                            );


                        const accept =
                            document.createElement(
                                "button"
                            );


                        accept.className =
                            "friend-button";


                        accept.textContent =
                            "Aceptar";


                        accept.onclick =
                            async () => {

                                await request(
                                    "/api/friends/accept",
                                    "POST",
                                    {
                                        requestId:
                                            requestData.id
                                    }
                                );


                                loadRequests();

                                loadFriends();

                            };


                        const reject =
                            document.createElement(
                                "button"
                            );


                        reject.className =
                            "danger-button";


                        reject.textContent =
                            "Rechazar";


                        reject.onclick =
                            async () => {

                                await request(
                                    "/api/friends/reject",
                                    "POST",
                                    {
                                        requestId:
                                            requestData.id
                                    }
                                );


                                loadRequests();

                            };


                        buttons.appendChild(
                            accept
                        );


                        buttons.appendChild(
                            reject
                        );


                        div.appendChild(
                            name
                        );


                        div.appendChild(
                            buttons
                        );


                        container.appendChild(
                            div
                        );

                    }
                );


            } catch (error) {

                container.textContent =
                    error.message;

            }

        }


        // =====================================================
        // AMIGOS
        // =====================================================

        async function loadFriends() {

            const container =
                document.getElementById(
                    "friends"
                );


            try {

                const data =
                    await request(
                        "/api/friends"
                    );


                container.innerHTML = "";


                if (
                    data.friends.length === 0
                ) {

                    container.textContent =
                        "Todavía no tienes amigos.";

                    return;
                }


                data.friends.forEach(
                    friend => {

                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            "result";


                        const name =
                            document.createElement(
                                "span"
                            );


                        name.textContent =
                            "⭐ " +
                            friend.username;


                        const remove =
                            document.createElement(
                                "button"
                            );


                        remove.className =
                            "danger-button";


                        remove.textContent =
                            "Eliminar";


                        remove.onclick =
                            () =>
                                removeFriend(
                                    friend.id
                                );


                        div.appendChild(
                            name
                        );


                        div.appendChild(
                            remove
                        );


                        container.appendChild(
                            div
                        );

                    }
                );


            } catch (error) {

                container.textContent =
                    error.message;

            }

        }


        // =====================================================
        // ELIMINAR AMIGO
        // =====================================================

        async function removeFriend(
            userId
        ) {

            if (
                !confirm(
                    "¿Eliminar este amigo?"
                )
            ) {

                return;
            }


            try {

                await request(
                    "/api/friends/remove",
                    "POST",
                    {
                        userId
                    }
                );


                loadFriends();


            } catch (error) {

                alert(
                    error.message
                );

            }

        }


        // =====================================================
        // INICIO
        // =====================================================

        window.addEventListener(
            "load",
            () => {

                updateAccount();

            }
        );

    </script>

</body>

</html>
